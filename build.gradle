plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.qamethod.datatesting'
//archivesBaseName = 'datatesting-core'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // ── Core data processing (the backbone of the framework) ──
    api 'io.github.vmzakharov:dataframe-ec:1.4.0'
    api 'org.eclipse.collections:eclipse-collections-api:13.0.0'
    implementation 'org.eclipse.collections:eclipse-collections:13.0.0'

    // ── SQLite for local analysis stores ──
    api 'org.xerial:sqlite-jdbc:3.45.1.0'

    // ── Excel report generation ──
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // ── YAML configuration ──
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0'
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // ── Test dependencies ──
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

// ── Publishing ──────────────────────────────────────────────

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Data Testing Core'
                description = 'Universal data testing framework built on dataframe-ec: ' +
                        'CSV/DB data loading, DataFrame-based filtering & comparison pipelines, ' +
                        'SQLite analysis stores, multi-cloud DB connectors, and report generation.'
                url = 'https://github.com/maakar/datatesting-core'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'maakar'
                        name = 'Ruslan Makarov'
                        email = 'kitmakar@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/maakar/datatesting-core.git'
                    developerConnection = 'scm:git:ssh://github.com:maakar/datatesting-core.git'
                    url = 'https://github.com/maakar/datatesting-core'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Exclude documentation and maintainer notes from published library artifacts.
tasks.withType(Jar).configureEach {
    exclude('docs/**')
    exclude('.internal/**')
}

test {
    useJUnitPlatform()
}

